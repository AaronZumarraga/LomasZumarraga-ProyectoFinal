# Usa la versión 2.1 del motor de CircleCI
version: 2.1

jobs:
  # Job 1: Imprimir un mensaje
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  # Job 2: Construcción de la aplicación
  build-app:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Build the app"
          command: "echo Building the app..."

  # Job 3: Ejecución de pruebas en paralelo
  run-tests:
    docker:
      - image: cimg/python:3.8  # Imagen con Python para pruebas
    parallelism: 2  # Ejecuta este job en 2 contenedores en paralelo
    steps:
      - checkout
      - run:
          name: "Run tests"
          command: |
            echo "Running tests in parallel..."
            # Aquí irían los comandos de prueba (por ejemplo, pytest, npm test, etc.)

  # Job 4: Despliegue
  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Deploying the app"
          command: "echo Deploying the application..."

# Workflows
workflows:
  # Workflow de desarrollo
  dev-workflow:
    jobs:
      - say-hello
      - build-app
      - run-tests

  # Workflow de producción
  prod-workflow:
    jobs:
      - build-app
      - run-tests
      - deploy
